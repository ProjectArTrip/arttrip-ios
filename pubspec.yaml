name: arttrip
description: "ArtTrip - Global Art Exhibition Booking App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.6
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.0
  kakao_flutter_sdk_user: 1.9.7+3
  shared_preferences: ^2.3.4
  flutter_dotenv: ^6.0.0
  go_router: ^17.0.0
  freezed_annotation: ^3.1.0
  provider: ^6.1.5+1
  json_annotation: ^4.11.0
  cached_network_image: ^3.4.1
  shimmer_animation: ^2.2.2+1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  table_calendar: ^3.2.0
  google_maps_flutter: ^2.14.0
  google_maps_cluster_manager_2: ^3.0.0+1
  geolocator: ^13.0.2
  package_info_plus: ^9.0.0
  webview_flutter: ^4.13.0
  calendar_date_picker2: ^2.0.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/svg/
    - assets/img/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
